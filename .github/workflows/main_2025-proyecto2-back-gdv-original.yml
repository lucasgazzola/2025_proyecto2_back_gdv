# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - 2025-proyecto2-back-gdv

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build --if-present

      - name: Prepare artifact (exclude node_modules and other unnecessary files)
        run: |
          mkdir deploy
          cp -r package*.json dist src .env* deploy/ 2>/dev/null || true
          cp -r prisma deploy/ 2>/dev/null || true
          echo "Artifact prepared in deploy folder"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Wait to avoid SCM container restart
        run: sleep 15

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8CCCE480C70F47C7B39C8C88DD18007F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D7FFA6CDD84F4AC295D6BCF8C38AF019 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_18DAC4432F784E5FA4164A1FD80D51F2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: '2025-proyecto2-back-gdv'
          slot-name: 'Production'
          package: .
